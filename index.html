<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖誕音樂劇籌備參與調查表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 py-10 px-4">
  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6 md:p-10 border border-slate-100">
    <header class="text-center mb-8">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">🎄 聖誕音樂劇籌備參與調查</h1>
      <p class="text-slate-500 text-sm md:text-base">請協助填寫您可以參與的演出及練團時間，感謝您的付出與協助！</p>
    </header>

    <form id="surveyForm" class="space-y-8">
      <!-- 基本資料 (已刪除電話) -->
      <div class="bg-slate-50 p-4 md:p-6 rounded-lg border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center">
          <span class="bg-slate-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs mr-2">1</span>
          基本資料
        </h2>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1" for="name">姓名 <span class="text-red-500">*</span></label>
          <input type="text" id="name" required placeholder="請輸入姓名" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <!-- 活動當日調查 1 -->
      <div class="bg-slate-50 p-4 md:p-6 rounded-lg border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-2 flex items-center">
          <span class="bg-slate-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs mr-2">2</span>
          12/13, 12/14 聚會參與調查 <span class="text-red-500 text-xs ml-1">*</span>
        </h2>
        <p class="text-xs text-slate-500 mb-4">12/13 (17:30-21:00) | 12/14 (08:00-16:00)</p>
        <div class="space-y-2">
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event1" value="三場都能參加" required class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我三場都能參加</span>
          </label>
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event1" value="只有12/13號的一場能參加" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我只有 12/13 的一場能參加</span>
          </label>
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event1" value="只有12/14號的兩場能參加" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我只有 12/14 的兩場能參加</span>
          </label>
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event1" value="都不行參加" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我都不行參加</span>
          </label>
        </div>
      </div>

      <!-- 活動當日調查 2 -->
      <div class="bg-slate-50 p-4 md:p-6 rounded-lg border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-2 flex items-center">
          <span class="bg-slate-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs mr-2">3</span>
          12/20, 12/21 聚會參與調查 <span class="text-red-500 text-xs ml-1">*</span>
        </h2>
        <p class="text-xs text-slate-500 mb-4">12/20 (17:30-21:00) | 12/21 (08:00-16:00)</p>
        <div class="space-y-2">
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event2" value="三場都能參加" required class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我三場都能參加</span>
          </label>
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event2" value="只有12/20號的一場能參加" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我只有 12/20 的一場能參加</span>
          </label>
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event2" value="只有12/21號的兩場能參加" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我只有 12/21 的兩場能參加</span>
          </label>
          <label class="flex items-center p-3 bg-white rounded-lg border hover:bg-indigo-50/50 cursor-pointer">
            <input type="radio" name="event2" value="都不行參加" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-3 text-sm text-slate-700">我都不行參加</span>
          </label>
        </div>
      </div>

      <!-- 練團時間調查 (動態行事曆) -->
      <div id="rehearsalSection" class="hidden bg-slate-50 p-4 md:p-6 rounded-lg border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-2 flex items-center">
          <span class="bg-indigo-600 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs mr-2">4</span>
          練團時間調查 (行事曆檢視) <span class="text-red-500 text-xs ml-1">*</span>
        </h2>
        <p class="text-xs text-slate-500 mb-4">請勾選您可以參與練習的時間區段：</p>
        
        <div id="calendarContainer" class="space-y-6"></div>
      </div>

      <!-- 備註 -->
      <div class="bg-slate-50 p-4 md:p-6 rounded-lg border border-slate-200">
        <label for="notes" class="block text-sm font-semibold text-slate-800 mb-2">備註 (選填)</label>
        <textarea id="notes" rows="3" placeholder="如有其他疑問或需補充說明事項，請在此填寫" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow-md transition duration-150">
        提交調查表
      </button>
    </form>
  </div>

  <script>
    // Firebase 初始化設定（替換成您自己的 Firebase 專案設定）
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const baseDates = [
      { id: '1115', dateStr: '11/15', dayOfWeek: 0, time: '16-18' },
      { id: '1117', dateStr: '11/17', dayOfWeek: 2, time: '19-21' },
      { id: '1119', dateStr: '11/19', dayOfWeek: 4, time: '19-21' },
      { id: '1122', dateStr: '11/22', dayOfWeek: 0, time: '16-18' },
      { id: '1124', dateStr: '11/24', dayOfWeek: 2, time: '19-21' },
      { id: '1126', dateStr: '11/26', dayOfWeek: 4, time: '19-21' },
      { id: '1129', dateStr: '11/29', dayOfWeek: 0, time: '16-18' },
      { id: '1201', dateStr: '12/01', dayOfWeek: 2, time: '19-21' },
      { id: '1203', dateStr: '12/03', dayOfWeek: 4, time: '19-21' },
      { id: '1206', dateStr: '12/06', dayOfWeek: 0, time: '16-18' },
      { id: '1208', dateStr: '12/08', dayOfWeek: 2, time: '19-21' },
      { id: '1210', dateStr: '12/10', dayOfWeek: 4, time: '19-21' },
      { id: '1213', dateStr: '12/13', dayOfWeek: 0, time: '16-18' },
    ];

    const extraDates = [
      { id: '1215', dateStr: '12/15', dayOfWeek: 2, time: '19-21' },
      { id: '1217', dateStr: '12/17', dayOfWeek: 4, time: '19-21' },
    ];

    // 週日為 0
    const weekBlocks = [
      { start: '11/08', end: '11/14', dates: [] },
      { start: '11/15', end: '11/21', dates: ['11/15', '11/17', '11/19'] },
      { start: '11/22', end: '11/28', dates: ['11/22', '11/24', '11/26'] },
      { start: '11/29', end: '12/05', dates: ['11/29', '12/01', '12/03'] },
      { start: '12/06', end: '12/12', dates: ['12/06', '12/08', '12/10'] },
      { start: '12/13', end: '12/19', dates: ['12/13', '12/15', '12/17'] },
    ];

    const event1Radios = document.querySelectorAll('input[name="event1"]');
    const event2Radios = document.querySelectorAll('input[name="event2"]');
    const rehearsalSection = document.getElementById('rehearsalSection');
    const calendarContainer = document.getElementById('calendarContainer');

    function updateRehearsalVisibility() {
      const e1Val = document.querySelector('input[name="event1"]:checked')?.value;
      const e2Val = document.querySelector('input[name="event2"]:checked')?.value;

      const e1Can = e1Val && e1Val !== '都不行參加';
      const e2Can = e2Val && e2Val !== '都不行參加';

      if (e1Can || e2Can) {
        rehearsalSection.classList.remove('hidden');
        renderCalendar(e2Can);
      } else {
        rehearsalSection.classList.add('hidden');
        calendarContainer.innerHTML = '';
      }
    }

    event1Radios.forEach(r => r.addEventListener('change', updateRehearsalVisibility));
    event2Radios.forEach(r => r.addEventListener('change', updateRehearsalVisibility));

    function renderCalendar(includeExtra) {
      calendarContainer.innerHTML = '';
      const activeList = includeExtra ? [...baseDates, ...extraDates] : baseDates;
      const activeDateMap = {};
      activeList.forEach(item => { activeDateMap[item.dateStr] = item; });

      weekBlocks.forEach((week) => {
        // 判斷該週是否有可選練團日
        const hasSession = week.dates.some(d => activeDateMap[d]);
        if (!hasSession) return; // 僅顯示有活動的週

        const weekWrapper = document.createElement('div');
        weekWrapper.className = 'bg-white rounded-lg border border-slate-200 p-3 shadow-sm';
        
        let headerHtml = `<div class="text-xs font-semibold text-slate-500 mb-2 border-b pb-1">當週時段 (${week.start} - ${week.end})</div>`;
        let gridHtml = `<div class="grid grid-cols-7 gap-1 text-center">
          <div class="text-xs font-medium text-red-500">日</div>
          <div class="text-xs font-medium text-slate-600">一</div>
          <div class="text-xs font-medium text-slate-600">二</div>
          <div class="text-xs font-medium text-slate-600">三</div>
          <div class="text-xs font-medium text-slate-600">四</div>
          <div class="text-xs font-medium text-slate-600">五</div>
          <div class="text-xs font-medium text-indigo-600">六</div>
        `;

        for (let dayIdx = 0; dayIdx < 7; dayIdx++) {
          let foundDate = null;
          week.dates.forEach(dStr => {
            if (activeDateMap[dStr] && activeDateMap[dStr].dayOfWeek === dayIdx) {
              foundDate = activeDateMap[dStr];
            }
          });

          if (foundDate) {
            gridHtml += `
              <div class="border border-indigo-200 bg-indigo-50/30 rounded p-1 min-h-[70px] flex flex-col items-center justify-between">
                <span class="text-xs font-bold text-slate-700">${foundDate.dateStr}</span>
                <span class="text-[10px] text-indigo-600">${foundDate.time}</span>
                <input type="checkbox" name="rehearsal" value="${foundDate.dateStr} (${foundDate.time})" class="mt-1 text-indigo-600 focus:ring-indigo-500 rounded">
              </div>
            `;
          } else {
            gridHtml += `<div class="bg-slate-50/50 rounded p-1 min-h-[70px]"></div>`;
          }
        }
        gridHtml += `</div>`;

        weekWrapper.innerHTML = headerHtml + gridHtml;
        calendarContainer.appendChild(weekWrapper);
      });
    }

    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const event1 = document.querySelector('input[name="event1"]:checked')?.value;
      const event2 = document.querySelector('input[name="event2"]:checked')?.value;
      const notes = document.getElementById('notes').value.trim();

      if (!name) {
        alert('請輸入您的姓名');
        return;
      }
      if (!event1 || !event2) {
        alert('請選擇前兩個活動的參加意願');
        return;
      }

      const rehearsalChecked = Array.from(document.querySelectorAll('input[name="rehearsal"]:checked'))
                                    .map(el => el.value);

      const payload = {
        name,
        event1,
        event2,
        rehearsals: rehearsalChecked,
        notes,
        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('responses').add(payload);
        alert('提交成功！感謝您的參與！');
        document.getElementById('surveyForm').reset();
        rehearsalSection.classList.add('hidden');
      } catch (err) {
        console.error('Error submitting:', err);
        alert('提交失敗，請稍後再試。');
      }
    });
  </script>
</body>
</html>
